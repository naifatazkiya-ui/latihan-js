<!DOCTYPE html>
<html lang="id"> 
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>latihan soal 2 - perulangan</title>
    </head>
    <body>
        <h2>hitung mundur</h2>
        <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

        <script>
            function hitungMundur(n) {
                for (let i = n; i >= 1; i--) {
                    console.log(i);
                }
            }

            hitungMundur(5); // Output: 5, 4, 3, 2, 1
        </script>
</html>
