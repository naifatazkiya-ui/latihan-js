    <h2>segitiga jam pasir</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>

        let n = 4;


for (let i = n; i >= 1; i--) {
    let hasil = "";

    for (let j = 1; j <= n - i; j++) {
        hasil += " ";
    }

    for (let k = 1; k <= (2 * i - 1); k++) {
        hasil += "* ";
    }

    console.log(hasil);
}


for (let i = 2; i <= n; i++) {
    let hasil = "";

    for (let j = 1; j <= n - i; j++) {
        hasil += " ";
    }

    for (let k = 1; k <= (2 * i - 1); k++) {
        hasil += "* ";
    }

    console.log(hasil);
}
        

    </script>
