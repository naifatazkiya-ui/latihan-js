<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan soal 3 - function</title>
</head>
<body>

    <h2>balik string</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        
        function balikString(str) {
            let hasil = "";
            for (let i = str.length - 1; i >= 0; i--) {
                hasil += str[i];
            }
            console.log(hasil);
        }
        balikString("Hello, World!");
    
    </script>
</html>
