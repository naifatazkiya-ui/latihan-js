<!DOCTYPE html>

<head>

</head>
<body>

    <h2>Segitiga kosong</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        
        function segitigaKosong(n) {
            let hasil = "";
            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= n - i; j++) {
                    hasil += " ";
                }
                for (let k = 1; k <= (2 * i - 1); k++) {
                    if (i === 1 || i === n || k === 1 || k === 2 * i - 1) {
                        hasil += "* ";
                    } else {
                        hasil += "  ";
                    }
                }
                hasil += "\n";
            }
            console.log(hasil);
        }
        
        segitigaKosong (5);
    
    </script>








</html>
